<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>NetWatch</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="splash"><div class="splash-in"><img src="icon.png" alt=""><div class="splash-name">NetWatch</div><div class="splash-sub">Checking your connection…</div><div class="splash-bar"><span></span></div></div></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" id="brandLogo"></div>
        <div>
          <div class="brand-name">NetWatch</div>
          <div class="brand-sub">Network monitor</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="status-pill" id="sidebarStatus">
          <span class="dot live"></span>
          <div class="grow"><div class="t">Starting…</div><div class="s">Measuring</div></div>
        </div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="drawer" id="drawer"></div>
  <div class="modal" id="modal"></div>
  <div class="toasts" id="toasts"></div>

  <script src="mode.js"></script>
  <script src="chart.umd.min.js"></script>
  <script src="world.js"></script>
  <script src="app.js"></script>
  <script src="app3.js"></script>
  <script src="app5.js"></script>
  <script src="app4.js"></script>
</body>
</html>
